name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jui-ui-vue

      # jui-ui-vue depends on jui-core-ts via "file:../jui-core-ts" (it isn't
      # published to npm yet), so that sibling repo has to be checked out and built
      # here too, the same way local development already expects it to exist next
      # to this repo on disk.
      - uses: actions/checkout@v4
        with:
          repository: juijs-vue/jui-core-ts
          path: jui-core-ts

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            jui-ui-vue/package-lock.json
            jui-core-ts/package-lock.json

      - name: Build jui-core-ts (local dependency)
        working-directory: jui-core-ts
        run: |
          npm ci
          npm run build

      - name: Install jui-ui-vue
        working-directory: jui-ui-vue
        run: npm ci

      - name: Build demo site
        working-directory: jui-ui-vue
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: jui-ui-vue/dist-playground

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
